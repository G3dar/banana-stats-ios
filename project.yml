# Banana Stats — minimal iOS app + WidgetKit extension showing Banana Airways Steam stats.
# Generate the Xcode project with `xcodegen generate`, build/install with ./push.sh.
name: BananaStats
options:
  bundleIdPrefix: com.3dar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Override both with TEAM_ID / BUNDLE_PREFIX env vars in push.sh when you are
    # not on the 3DAR team (bundle ids are unique across Apple teams).
    DEVELOPMENT_TEAM: 93K49S8Q8U
    BUNDLE_PREFIX: com.3dar
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The Xcode 16+ debug dylib keeps the widget out of the gallery when the
    # app is installed with devicectl (no debugger to inject it).
    ENABLE_DEBUG_DYLIB: NO
targets:
  BananaStats:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Banana Stats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).bananastats
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: BananaStatsWidget
        embed: true
  BananaStatsWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Banana Stats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).bananastats.widget
        SKIP_INSTALL: YES
